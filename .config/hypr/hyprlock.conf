# Modern Hyprlock Configuration

background {
    monitor =
    path = $HOME/.cache/current_wallpaper.jpg
    blur_passes = 1
    blur_size = 3
    brightness = 0.5
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

# Time display
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = Monoid 
    position = 0, 350
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
}

# Date display
label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %d"
    color = rgba(255, 255, 255, 0.7)
    font_size = 15
    font_family = Monoid 
    position = 0, -500
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Username
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = Monoid 
    position = 0, -450
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Password input field
input-field {
    monitor =
    size = 50, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0)
    font_color = rgba(255, 255, 255, 0.5)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##ffffff80">Enter password</span>
    hide_input = true
    rounding = 50
    check_color = rgba(100, 200, 100, 0.8)
    fail_color = rgba(240, 80, 80, 0.8)
    fail_text = <span foreground="##ff5050"><i>Authentication failed</i></span>
    fail_transition = 300
    capslock_color = rgba(255, 200, 100, 0.8)
    position = 0, -350
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
}
