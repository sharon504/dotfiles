# Battery Monitor Configuration
# This file is sourced by the battery-monitor.sh script
# Edit these values to customize the battery monitoring behavior

# Battery percentage thresholds
WARNING_THRESHOLD=20      # Show warning notification at this percentage
CRITICAL_THRESHOLD=10     # Show critical notification at this percentage

# Time intervals (in seconds)
REMINDER_INTERVAL=300     # 5 minutes - how often to repeat notifications
CHECK_INTERVAL=30         # 30 seconds - how often to check battery level

# Sound alerts
ENABLE_SOUND=true
WARNING_SOUND="/usr/share/sounds/freedesktop/stereo/alarm-clock-elapsed.oga"
CRITICAL_SOUND="/usr/share/sounds/freedesktop/stereo/alarm-clock-elapsed.oga"

# Features
ENABLE_REMINDERS=true     # Repeat notifications every REMINDER_INTERVAL while below threshold

# Notes:
# - Set ENABLE_SOUND=false to disable sound alerts
# - Set ENABLE_REMINDERS=false to only notify once per threshold
# - You can use custom sound files by changing the *_SOUND paths
# - Restart the service after changing: systemctl --user restart battery-monitor
